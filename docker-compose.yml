services:
  server:
    build:
      context: ./server
    env_file: ./server/.env
    environment:
      CLIENT_URL: https://localhost
    restart: unless-stopped

  client:
    build:
      context: ./client
      args:
        VITE_API_URL: /api
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./server/certs:/etc/nginx/certs:ro
    depends_on:
      - server
    restart: unless-stopped
